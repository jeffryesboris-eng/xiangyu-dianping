name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-test.txt
      - run: python -m pytest
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable CI environment
        run: |
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" > .env
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo 'APP_PORT=8082' >> .env
          echo 'DEMO_LOGIN=false' >> .env
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 300
      - name: Verify app and seeded shop data
        run: |
          curl --fail http://127.0.0.1:8082/health
          python -c "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8082/shop/of/type?typeId=1')); assert d['success'] and len(d['data']) == 5"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
